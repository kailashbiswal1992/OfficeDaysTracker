<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Office Days Tracker - Voya</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);color:#172033;min-height:100vh}
.app{max-width:950px;margin:auto;padding:20px}
.header{background:white;border-radius:16px;padding:20px;margin-bottom:24px;box-shadow:0 4px 20px rgba(0,0,0,0.08);display:flex;justify-content:space-between;align-items:center}
.logo-section{display:flex;align-items:center;gap:16px}
.logo-link{display:flex;align-items:center;gap:16px;text-decoration:none;cursor:pointer}
.logo{width:50px;height:50px;background:linear-gradient(135deg,#0066cc 0%,#0052a3 100%);border-radius:10px;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;font-size:24px}
.title-group h1{font-size:28px;margin:0;font-weight:700;color:#0f172a}
.title-group p{font-size:13px;color:#64748b;margin:4px 0 0 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.controls{display:flex;gap:8px;align-items:center}
.controls button,.controls select{padding:10px 14px;border:1px solid #e2e8f0;border-radius:10px;background:white;font-size:15px;cursor:pointer;font-weight:500;color:#0f172a;transition:all 0.2s}
.controls button:hover,.controls select:hover{background:#f8fafc;border-color:#cbd5e1}
.controls select{padding:10px 12px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:24px 0}
.card{background:white;border-radius:14px;padding:18px;box-shadow:0 2px 12px rgba(0,0,0,0.06);border-left:4px solid #0066cc;transition:transform 0.2s,box-shadow 0.2s}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,0.1)}
.card:nth-child(2){border-left-color:#10b981}
.card:nth-child(3){border-left-color:#f59e0b}
.card:nth-child(4){border-left-color:#8b5cf6}
.label{font-size:12px;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}
.value{font-size:32px;font-weight:700;color:#0f172a}
.value.highlight{color:#0066cc}
.calendar{background:white;border-radius:16px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,0.08)}
.monthhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.monthhead button{border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;background:white;cursor:pointer;font-size:18px;color:#0066cc;font-weight:600;transition:all 0.2s}
.monthhead button:hover{background:#f0f6ff;border-color:#0066cc}
.monthhead strong{font-size:20px;color:#0f172a;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{text-align:center;font-size:12px;color:#64748b;padding:12px 0;font-weight:700;text-transform:uppercase;letter-spacing:0.5px}
.day{min-height:76px;border:2px solid #e2e8f0;border-radius:10px;background:#fff;padding:8px;cursor:pointer;position:relative;transition:all 0.2s;display:flex;flex-direction:column}
.day:hover{border-color:#0066cc;box-shadow:0 4px 12px rgba(0,102,204,0.1)}
.day.empty{border:0;background:transparent;cursor:default}
.day.empty:hover{border:0}
.day.office{background:linear-gradient(135deg,#f0f9ff 0%,#e0f2fe 100%);border-color:#0066cc;box-shadow:0 2px 8px rgba(0,102,204,0.15)}
.day.weekend{background:#f8f9fa;border-color:#e5e7eb;color:#9ca3af}
.day.today{outline:2px solid #f59e0b;outline-offset:-2px;box-shadow:0 0 0 3px rgba(245,158,11,0.1)}
.day .num{font-weight:700;font-size:16px;color:#0f172a}
.day.weekend .num{color:#9ca3af}
.day .tag{font-size:10px;color:#0066cc;font-weight:700;background:#e0f2fe;padding:2px 6px;border-radius:4px;width:fit-content;margin-top:auto}
.note{margin-top:16px;font-size:13px;color:#64748b;padding:12px;background:#f8fafc;border-left:3px solid #0066cc;border-radius:6px}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.actions button{border:none;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.2s;text-transform:uppercase;letter-spacing:0.5px}
.actions button:nth-child(1){background:#10b981;color:white;box-shadow:0 4px 12px rgba(16,185,129,0.3)}
.actions button:nth-child(1):hover{background:#059669;transform:translateY(-2px);box-shadow:0 6px 16px rgba(16,185,129,0.4)}
.actions button:nth-child(2){background:#0066cc;color:white;box-shadow:0 4px 12px rgba(0,102,204,0.3)}
.actions button:nth-child(2):hover{background:#0052a3;transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,102,204,0.4)}
.actions button:nth-child(3){background:#6366f1;color:white;box-shadow:0 4px 12px rgba(99,102,241,0.3)}
.actions button:nth-child(3):hover{background:#4f46e5;transform:translateY(-2px);box-shadow:0 6px 16px rgba(99,102,241,0.4)}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;z-index:1000}
.modal.active{display:flex}
.modal-content{background:white;border-radius:16px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,0.3);max-width:400px;width:90%;text-align:center}
.modal-content h2{margin:0 0 12px 0;font-size:20px;color:#0f172a}
.modal-content p{margin:0 0 24px 0;font-size:14px;color:#64748b;line-height:1.6}
.modal-buttons{display:flex;gap:12px;justify-content:center}
.modal-buttons button{border:none;border-radius:10px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.2s}
.modal-buttons .confirm{background:#10b981;color:white;box-shadow:0 4px 12px rgba(16,185,129,0.3)}
.modal-buttons .confirm:hover{background:#059669;transform:translateY(-2px)}
.modal-buttons .cancel{background:#e2e8f0;color:#0f172a;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.modal-buttons .cancel:hover{background:#cbd5e1;transform:translateY(-2px)}
#fileInput{display:none}

@media(max-width:768px){
  .app{padding:16px}
  .header{padding:16px;gap:12px}
  .logo{width:44px;height:44px;font-size:20px}
  .title-group h1{font-size:24px}
  .summary{gap:12px;margin:16px 0}
  .card{padding:14px}
  .value{font-size:28px}
  .label{font-size:11px}
  .calendar{padding:16px}
  .day{min-height:70px;padding:6px;font-size:13px}
  .day .num{font-size:15px}
  .grid{gap:5px}
  .monthhead strong{font-size:18px}
  .controls button,.controls select{padding:8px 12px;font-size:13px}
  .note{font-size:12px;padding:10px;margin-top:12px}
  .actions{gap:8px}
  .actions button{padding:9px 14px;font-size:12px}
}

@media(max-width:600px){
  .app{padding:12px}
  .header{flex-direction:column;text-align:center;gap:10px;padding:14px}
  .logo-section{flex-direction:column;gap:10px}
  .logo{width:40px;height:40px;font-size:18px}
  .title-group h1{font-size:20px}
  .title-group p{font-size:12px}
  .summary{grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
  .card{padding:12px;border-radius:10px}
  .value{font-size:24px}
  .label{font-size:10px;margin-bottom:6px}
  .controls{flex-direction:row;width:100%;justify-content:center;gap:6px;flex-wrap:wrap}
  .controls button,.controls select{flex:1;min-width:70px;padding:8px 10px;font-size:12px}
  .calendar{padding:12px;border-radius:12px}
  .grid{gap:4px}
  .day{min-height:60px;padding:5px;font-size:12px;border-radius:8px;border-width:1px}
  .day .num{font-size:13px}
  .day .tag{font-size:8px;padding:1px 4px}
  .dow{padding:8px 0;font-size:11px}
  .monthhead{margin-bottom:12px;gap:8px}
  .monthhead button{padding:8px 10px;font-size:16px}
  .monthhead strong{font-size:16px}
  .note{font-size:11px;padding:8px;margin-top:10px;border-radius:4px}
  .actions{gap:6px;margin-top:12px;flex-wrap:wrap}
  .actions button{padding:8px 10px;font-size:11px;flex:1}
  .modal-content{max-width:90vw;padding:20px}
  .modal-content h2{font-size:18px}
  .modal-content p{font-size:13px;margin:0 0 18px 0}
  .modal-buttons{flex-wrap:wrap}
  .modal-buttons button{flex:1;min-width:100px}
}

@media(max-width:400px){
  .app{padding:8px}
  .header{padding:10px;gap:8px}
  .logo{width:36px;height:36px;font-size:16px}
  .title-group h1{font-size:18px}
  .title-group p{font-size:11px}
  .summary{grid-template-columns:1fr;gap:8px;margin:8px 0}
  .card{padding:10px;border-radius:8px}
  .value{font-size:22px}
  .label{font-size:9px}
  .controls{gap:4px}
  .controls button,.controls select{padding:6px 8px;font-size:11px;min-width:60px}
  .calendar{padding:10px;border-radius:10px}
  .grid{gap:3px}
  .day{min-height:55px;padding:4px;font-size:11px}
  .day .num{font-size:12px}
  .monthhead button{padding:6px 8px;font-size:14px}
  .monthhead strong{font-size:14px}
  .note{font-size:10px;padding:6px;border-radius:4px;margin-top:8px}
  .actions{gap:4px;margin-top:8px;flex-wrap:wrap}
  .actions button{padding:7px 6px;font-size:10px;flex:1}
  .modal-content{max-width:95vw;padding:16px}
  .modal-content h2{font-size:16px}
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <a href="https://www.voya.com/" target="_blank" class="logo-link">
      <div class="logo">V</div>
      <div class="title-group">
        <h1>Office Days Tracker</h1>
        <p>Powered by KCB</p>
      </div>
    </a>
    <div class="controls">
      <button id="prev">‹ Year</button>
      <select id="year"></select>
      <button id="next">Year ›</button>
    </div>
  </div>

  <div class="summary">
    <div class="card">
      <div class="label">Selected this quarter</div>
      <div class="value highlight" id="qdays">0</div>
    </div>
    <div class="card">
      <div class="label">Quarter target</div>
      <div class="value">24</div>
    </div>
    <div class="card">
      <div class="label">Remaining</div>
      <div class="value" id="remaining">24</div>
    </div>
    <div class="card">
      <div class="label">Year total</div>
      <div class="value" id="ydays">0</div>
    </div>
  </div>

  <div class="calendar">
    <div class="monthhead">
      <button id="prevMonth">‹ Prev</button>
      <strong id="monthTitle"></strong>
      <button id="nextMonth">Next ›</button>
    </div>
    <div class="grid" id="calendar"></div>
    <div class="note">💡 Tap/click a date to mark or unmark an office day. Weekends are shown separately but can still be selected.</div>
    <div class="actions">
      <button id="clearQuarter">Clear Quarter</button>
      <button id="export">Export Data</button>
      <button id="import">Import Data</button>
    </div>
  </div>
</div>

<div class="modal" id="confirmModal">
  <div class="modal-content">
    <h2 id="modalTitle">Confirm Action</h2>
    <p id="modalMessage">Are you sure?</p>
    <div class="modal-buttons">
      <button class="cancel" onclick="closeModal()">Cancel</button>
      <button class="confirm" onclick="confirmAction()">Confirm</button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept=".json">

<script>
const KEY="officeDaysTracker_v1";
let data=JSON.parse(localStorage.getItem(KEY)||"{}");
let view=new Date(); view.setDate(1);
const $=id=>document.getElementById(id);
let pendingAction=null;

function save(){localStorage.setItem(KEY,JSON.stringify(data));}
function key(d){return d.toISOString().slice(0,10)}
function quarter(m){return Math.floor(m/3)+1}
function quarterRange(y,q){return [new Date(y,(q-1)*3,1),new Date(y,q*3,0)]}
function daysInQuarter(y,q){let [a,b]=quarterRange(y,q), n=0;for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1)) if(data[key(d)])n++;return n}

function showModal(title,message,action){
  $("modalTitle").textContent=title;
  $("modalMessage").textContent=message;
  pendingAction=action;
  $("confirmModal").classList.add("active");
}

function closeModal(){
  $("confirmModal").classList.remove("active");
  pendingAction=null;
}

function confirmAction(){
  if(pendingAction)pendingAction();
  closeModal();
}

function render(){
  const y=view.getFullYear(), m=view.getMonth(), q=quarter(m);
  $("monthTitle").textContent=view.toLocaleString(undefined,{month:"long",year:"numeric"});
  $("year").value=y;
  const first=new Date(y,m,1), last=new Date(y,m+1,0);
  const cal=$("calendar");cal.innerHTML="";
  ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(x=>{let e=document.createElement("div");e.className="dow";e.textContent=x;cal.appendChild(e)});
  for(let i=0;i<first.getDay();i++){let e=document.createElement("div");e.className="day empty";cal.appendChild(e)}
  for(let n=1;n<=last.getDate();n++){
    let d=new Date(y,m,n), k=key(d), e=document.createElement("div");
    e.className="day"+(d.getDay()==0||d.getDay()==6?" weekend ":"")+(data[k]?" office ":"")+(key(d)==key(new Date())?" today":"");
    e.innerHTML='<div class="num">'+n+'</div>'+(data[k]?'<div class="tag">OFFICE</div>':'');
    e.onclick=()=>{
      const dateStr=d.toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"});
      const isMarked=!!data[k];
      const action=isMarked?"Mark as non-office day":"Mark as office day";
      showModal("Confirm Date Selection",`${action}?\n${dateStr}`,()=>{
        data[k]=!data[k];
        if(!data[k])delete data[k];
        save();
        render();
      });
    };
    cal.appendChild(e);
  }
  const qcount=daysInQuarter(y,q);
  $("qdays").textContent=qcount;$("remaining").textContent=Math.max(0,24-qcount);
  let total=0;Object.keys(data).forEach(k=>{if(k.startsWith(y+"-"))total++});$("ydays").textContent=total;
}

for(let y=2025;y<=2035;y++){let o=document.createElement("option");o.value=y;o.textContent=y;$("year").appendChild(o)}
$("year").onchange=()=>{view.setFullYear(+$("year").value);render()};
$("prev").onclick=()=>{view.setFullYear(view.getFullYear()-1);render()};
$("next").onclick=()=>{view.setFullYear(view.getFullYear()+1);render()};
$("prevMonth").onclick=()=>{view.setMonth(view.getMonth()-1);render()};
$("nextMonth").onclick=()=>{view.setMonth(view.getMonth()+1);render()};

$("clearQuarter").onclick=()=>{
  showModal("Clear Quarter","Are you sure you want to clear all selected office days in this quarter?",()=>{
    const y=view.getFullYear(),q=quarter(view.getMonth()),[a,b]=quarterRange(y,q);
    for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1))delete data[key(d)];
    save();render();
  });
};

$("export").onclick=()=>{
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="office-days.json";a.click();URL.revokeObjectURL(a.href);
};

$("import").onclick=()=>{$("fileInput").click()};

$("fileInput").onchange=(e)=>{
  const file=e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=(evt)=>{
    try{
      const imported=JSON.parse(evt.target.result);
      if(typeof imported!=="object"||imported===null){
        alert("Invalid file format. Please use the exported JSON file.");
        return;
      }
      showModal("Import Data","This will replace all your current data. Do you want to continue?",()=>{
        data=imported;
        save();
        render();
        alert("Data imported successfully!");
      });
    }catch(err){
      alert("Error reading file. Please make sure it's a valid JSON file.");
    }
  };
  reader.readAsText(file);
  $("fileInput").value="";
};

document.addEventListener("keydown",(e)=>{
  if(e.key==="Escape")closeModal();
});

$("confirmModal").addEventListener("click",(e)=>{
  if(e.target===$("confirmModal"))closeModal();
});

render();
</script>
</body>
</html>
