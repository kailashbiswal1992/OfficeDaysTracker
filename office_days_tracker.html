<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Office Days Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f7fb;color:#172033}
.app{max-width:850px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:24px;margin:0}.controls{display:flex;gap:8px;align-items:center}.controls button,.controls select{padding:9px 12px;border:1px solid #ccd3df;border-radius:9px;background:white;font-size:15px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.card{background:white;border:1px solid #e0e5ed;border-radius:12px;padding:13px}.label{font-size:12px;color:#687386}.value{font-size:23px;font-weight:700;margin-top:3px}
.calendar{background:white;border:1px solid #e0e5ed;border-radius:14px;padding:14px}.monthhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.monthhead button{border:0;background:#eef2f7;border-radius:8px;padding:7px 12px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;font-size:12px;color:#687386;padding:7px 0;font-weight:600}
.day{min-height:70px;border:1px solid #e2e6ed;border-radius:9px;background:#fff;padding:7px;cursor:pointer;position:relative}.day:hover{background:#f3f6fb}.day.empty{border:0;background:transparent;cursor:default}
.day .num{font-weight:650}.day .tag{position:absolute;bottom:6px;left:6px;font-size:10px;color:#1f6b43}
.day.office{background:#e8f7ef;border-color:#70c59a}.day.weekend{background:#f7f7f8;color:#9aa2ae}.day.today{outline:2px solid #5b7cfa;outline-offset:-2px}
.note{margin-top:12px;font-size:13px;color:#687386}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.actions button{border:1px solid #ccd3df;background:white;border-radius:9px;padding:9px 12px}
@media(max-width:600px){.summary{grid-template-columns:repeat(2,1fr)}.day{min-height:58px;padding:5px}.day .tag{font-size:9px}.app{padding:12px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>Office Days Tracker</h1>
    <div class="controls">
      <button id="prev">‹</button>
      <select id="year"></select>
      <button id="next">›</button>
    </div>
  </div>

  <div class="summary">
    <div class="card"><div class="label">Selected this quarter</div><div class="value" id="qdays">0</div></div>
    <div class="card"><div class="label">Quarter target</div><div class="value">24</div></div>
    <div class="card"><div class="label">Remaining</div><div class="value" id="remaining">24</div></div>
    <div class="card"><div class="label">Year total</div><div class="value" id="ydays">0</div></div>
  </div>

  <div class="calendar">
    <div class="monthhead">
      <button id="prevMonth">‹</button>
      <strong id="monthTitle"></strong>
      <button id="nextMonth">›</button>
    </div>
    <div class="grid" id="calendar"></div>
    <div class="note">Tap/click a date to mark or unmark an office day. Weekends are shown separately but can still be selected.</div>
    <div class="actions">
      <button id="clearQuarter">Clear current quarter</button>
      <button id="export">Export data</button>
    </div>
  </div>
</div>

<script>
const KEY="officeDaysTracker_v1";
let data=JSON.parse(localStorage.getItem(KEY)||"{}");
let view=new Date(); view.setDate(1);
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(data));}
function key(d){return d.toISOString().slice(0,10)}
function quarter(m){return Math.floor(m/3)+1}
function quarterRange(y,q){return [new Date(y,(q-1)*3,1),new Date(y,q*3,0)]}
function daysInQuarter(y,q){let [a,b]=quarterRange(y,q), n=0;for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1)) if(data[key(d)])n++;return n}
function render(){
  const y=view.getFullYear(), m=view.getMonth(), q=quarter(m);
  $("monthTitle").textContent=view.toLocaleString(undefined,{month:"long",year:"numeric"});
  $("year").value=y;
  const first=new Date(y,m,1), last=new Date(y,m+1,0);
  const cal=$("calendar");cal.innerHTML="";
  ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(x=>{let e=document.createElement("div");e.className="dow";e.textContent=x;cal.appendChild(e)});
  for(let i=0;i<first.getDay();i++){let e=document.createElement("div");e.className="day empty";cal.appendChild(e)}
  for(let n=1;n<=last.getDate();n++){
    let d=new Date(y,m,n), k=key(d), e=document.createElement("div");
    e.className="day"+(d.getDay()==0||d.getDay()==6?" weekend ":"")+(data[k]?" office ":"")+(key(d)==key(new Date())?" today":"");
    e.innerHTML='<div class="num">'+n+'</div>'+(data[k]?'<div class="tag">OFFICE</div>':'');
    e.onclick=()=>{data[k]=!data[k];if(!data[k])delete data[k];save();render()};
    cal.appendChild(e);
  }
  const qcount=daysInQuarter(y,q);
  $("qdays").textContent=qcount;$("remaining").textContent=Math.max(0,24-qcount);
  let total=0;Object.keys(data).forEach(k=>{if(k.startsWith(y+"-"))total++});$("ydays").textContent=total;
}
for(let y=2025;y<=2035;y++){let o=document.createElement("option");o.value=y;o.textContent=y;$("year").appendChild(o)}
$("year").onchange=()=>{view.setFullYear(+$("year").value);render()};
$("prev").onclick=()=>{view.setFullYear(view.getFullYear()-1);render()};
$("next").onclick=()=>{view.setFullYear(view.getFullYear()+1);render()};
$("prevMonth").onclick=()=>{view.setMonth(view.getMonth()-1);render()};
$("nextMonth").onclick=()=>{view.setMonth(view.getMonth()+1);render()};
$("clearQuarter").onclick=()=>{
  if(confirm("Clear all selected office days in this quarter?")){
    const y=view.getFullYear(),q=quarter(view.getMonth()),[a,b]=quarterRange(y,q);
    for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1))delete data[key(d)];
    save();render();
  }
};
$("export").onclick=()=>{
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="office-days.json";a.click();URL.revokeObjectURL(a.href);
};
render();
</script>
</body>
</html>
