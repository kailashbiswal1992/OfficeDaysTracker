<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Office Days Tracker</title>
  <desc id="desc">A layered VOD monogram with a calendar check on an orange rounded square.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9700"/>
      <stop offset="100%" stop-color="#f04400"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16b8ef"/>
      <stop offset="100%" stop-color="#1651db"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="92" fill="url(#bg)"/>

  <!-- The V is the base monogram; the O and D layer over its right side. -->
  <path d="M58 128h43c6 0 10 3 13 9l62 128 68-119c13-23 35-36 61-36h23L173 385z" fill="#fff"/>
  <circle cx="337" cy="276" r="132" fill="url(#ring)"/>
  <circle cx="337" cy="276" r="99" fill="#f87508"/>

  <path d="M276 202h62c51 0 81 28 81 75s-30 75-81 75h-62z" fill="#123a70"/>

  <!-- Small calendar check stays simple and legible at app-icon size. -->
  <g transform="translate(302 249)">
    <rect x="0" y="9" width="63" height="62" rx="10" fill="#f8fafc"/>
    <path d="M0 19a10 10 0 0 1 10-10h43a10 10 0 0 1 10 10v8H0z" fill="#dbeafe"/>
    <path d="M17 5v15M46 5v15" stroke="#123a70" stroke-width="6" stroke-linecap="round"/>
    <path d="m18 47 10 9 19-20" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="256" y="448" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="1.5">OFFICE DAYS TRACKER</text>
</svg>
